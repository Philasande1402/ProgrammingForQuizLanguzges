<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - Quiz Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .user-welcome {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .quiz-title {
            color: #2d3748;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .question-container {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-label:hover {
            background: #edf2f7;
            border-color: #4f46e5;
        }

        .option-label input {
            margin-right: 10px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(79, 70, 229, 0.4);
        }

        .back-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .user-welcome {
                top: 20px;
                right: 20px;
                font-size: 1rem;
                padding: 8px 16px;
            }

            .container {
                padding: 20px;
            }

            .quiz-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<!-- User Welcome in top-right corner -->
<div class="user-welcome" th:if="${userFirstName}">
    Welcome, <span th:text="${userFirstName}">User</span>!
</div>

<div class="container">
    <a href="/quiz/search" class="back-btn">← Back to Search</a>

    <div class="quiz-header">
        <h1 class="quiz-title" th:text="${quizTitle}">Quiz Title</h1>
        <p>Total Questions: <span th:text="${totalQuestions}">0</span></p>
    </div>

    <form id="quizForm" th:action="@{/quiz/submit}" method="POST">
        <input type="hidden" name="questionSetId" th:value="${questionSetId}">

        <div th:each="quiz, iter : ${quizzes}">
            <div class="question-container">
                <div class="question-text" th:text="${iter.index + 1 + '. ' + quiz.questionTitle}">
                    Question text here
                </div>
                <div class="options-container">
                    <label class="option-label">
                        <input type="radio" th:name="'answer_' + ${quiz.id}" th:value="${quiz.option1}" required>
                        <span th:text="${quiz.option1}">Option 1</span>
                    </label>
                    <label class="option-label">
                        <input type="radio" th:name="'answer_' + ${quiz.id}" th:value="${quiz.option2}">
                        <span th:text="${quiz.option2}">Option 2</span>
                    </label>
                    <label class="option-label">
                        <input type="radio" th:name="'answer_' + ${quiz.id}" th:value="${quiz.option3}">
                        <span th:text="${quiz.option3}">Option 3</span>
                    </label>
                    <label class="option-label">
                        <input type="radio" th:name="'answer_' + ${quiz.id}" th:value="${quiz.option4}">
                        <span th:text="${quiz.option4}">Option 4</span>
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn">Submit Quiz</button>
    </form>
</div>
</body>
</html>
