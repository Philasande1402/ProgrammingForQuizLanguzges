<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - Quiz Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-welcome {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .result-title {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .rating {
            font-size: 1.5rem;
            color: #4f46e5;
            font-weight: 600;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #f8faff;
            border-radius: 50px;
            display: inline-block;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .stat-item {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .progress-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .progress-circle {
            transform: rotate(-90deg);
            width: 120px;
            height: 120px;
        }

        .progress-circle-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 8;
        }

        .progress-circle-fill {
            fill: none;
            stroke: #4f46e5;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 283;
            transition: stroke-dashoffset 1s ease-in-out;
        }

        .progress-text {
            font-size: 1.5rem;
            font-weight: 700;
            fill: #4f46e5;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .performance-message {
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border-left: 4px solid #4f46e5;
        }

        .performance-title {
            color: #2d3748;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .performance-text {
            color: #64748b;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            .result-title {
                font-size: 2rem;
            }

            .score-display {
                font-size: 3rem;
            }

            .stats-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<!-- User Welcome in top-right corner -->
<div class="user-welcome" th:if="${userFirstName}">
    Welcome, <span th:text="${userFirstName}">User</span>!
</div>

<div class="container">
    <!-- Result Icon -->
    <div class="result-icon">
        <span th:if="${percentage >= 70}">🎉</span>
        <span th:if="${percentage >= 50 && percentage < 70}">👍</span>
        <span th:if="${percentage < 50}">💪</span>
    </div>

    <!-- Result Title -->
    <h1 class="result-title">Quiz Completed!</h1>

    <!-- Score Display -->
    <div class="score-display" th:text="${score + '/' + totalQuestions}">0/0</div>

    <!-- Rating -->
    <div class="rating" th:text="${rating}">Rating</div>

    <!-- Progress Circle -->
    <div class="progress-ring">
        <svg class="progress-circle" viewBox="0 0 120 120">
            <circle class="progress-circle-bg" cx="60" cy="60" r="45"></circle>
            <circle class="progress-circle-fill" cx="60" cy="60" r="45"
                    th:style="'stroke-dashoffset:' + ${283 - (percentage * 2.83)}"></circle>
            <text class="progress-text" x="60" y="65" text-anchor="middle" th:text="${percentage} + '%'">0%</text>
        </svg>
    </div>

    <!-- Statistics -->
    <div class="stats-container">
        <div class="stat-item">
            <div class="stat-value" th:text="${score}">0</div>
            <div class="stat-label">Correct Answers</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" th:text="${totalQuestions - score}">0</div>
            <div class="stat-label">Incorrect Answers</div>
        </div>
    </div>

    <!-- Performance Message -->
    <div class="performance-message">
        <div class="performance-title">Your Performance</div>
        <div class="performance-text" th:text="'You scored ' + ${score} + ' out of ' + ${totalQuestions} + ' questions correctly (' + ${percentage} + '%). ' + ${rating}">
            Performance summary will appear here.
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <a th:href="@{/}" class="btn btn-primary">
            ← Back to Home
        </a>
        <a th:href="@{/take-quiz(questionSetId=${questionSetId})}" class="btn btn-secondary">
            ↻ Retry Quiz
        </a>
    </div>
</div>

<script>
    // Animate the progress circle
    document.addEventListener('DOMContentLoaded', function() {
        const progressFill = document.querySelector('.progress-circle-fill');
        const percentage = [[${percentage}]];
        const circumference = 283; // 2 * π * r (where r=45)
        const offset = circumference - (percentage / 100) * circumference;

        // Set initial state
        progressFill.style.strokeDashoffset = circumference;

        // Animate after a short delay
        setTimeout(() => {
            progressFill.style.strokeDashoffset = offset;
        }, 500);
    });
</script>
</body>
</html>
