<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .result-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            font-weight: bold;
            border: 5px solid #e2e8f0;
        }
        .score-main {
            font-size: 2.5rem;
            line-height: 1;
        }
        .score-total {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .stat-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4f46e5;
        }
        .btn-retry {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            color: white;
        }
        .btn-home {
            background: #6b7280;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            background: #4b5563;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="result-container">
    <h1>🎉 Quiz Completed! 🎉</h1>
    <p class="lead">Here are your results:</p>

    <div class="score-circle">
        <div class="score-main" th:text="${score}">0</div>
        <div class="score-total" th:text="'/' + ${totalQuestions}">/0</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-value" th:text="${score}">0</div>
            <div>Correct</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" th:text="${totalQuestions - score}">0</div>
            <div>Incorrect</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" th:text="${percentage} + '%'">0%</div>
            <div>Score</div>
        </div>
    </div>

    <div th:if="${percentage >= 70}" class="alert alert-success">
        <strong>Excellent!</strong> You passed the quiz!
    </div>
    <div th:if="${percentage < 70}" class="alert alert-warning">
        <strong>Good try!</strong> Keep practicing to improve your score.
    </div>

    <div class="mt-4">
        <a th:href="@{/quiz/{id}(id=${questionSetId})}" class="btn-retry">
            Retry This Quiz
        </a>
        <a href="/" class="btn-home">
            Back to Home
        </a>
    </div>
</div>
</body>
</html>
