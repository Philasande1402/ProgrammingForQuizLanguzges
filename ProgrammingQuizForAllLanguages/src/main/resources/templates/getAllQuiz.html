<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Questions Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        /* Table styles */
        .table-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            overflow-x: auto;
        }

        .quiz-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .quiz-table th {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .quiz-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: top;
        }

        .quiz-table tr:hover {
            background-color: #f5f5f5;
        }

        .id-cell {
            text-align: center;
            font-weight: 600;
            color: #1e3a8a;
            min-width: 60px;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
        }

        .option {
            padding: 8px 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #3182ce;
            display: flex;
            align-items: center;
        }

        .correct-option {
            background-color: #e6f7e9;
            border-left: 3px solid #38a169;
            font-weight: 600;
            position: relative;
        }

        .correct-option::after {
            content: "✓ Correct Answer";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #38a169;
            font-weight: 600;
        }

        .option-label {
            font-weight: 600;
            color: #1e3a8a;
            margin-right: 8px;
            min-width: 20px;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f4f8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .meta-item i {
            color: #1e3a8a;
        }

        .difficulty-easy {
            color: #38a169;
        }

        .difficulty-medium {
            color: #d69e2e;
        }

        .difficulty-hard {
            color: #e53e3e;
        }

        .action-cell {
            text-align: center;
            min-width: 150px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background-color: #3182ce;
            color: white;
        }

        .btn-edit:hover {
            background-color: #2c5aa0;
            transform: translateY(-2px);
        }

        .btn-delete {
            background-color: #e53e3e;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c53030;
            transform: translateY(-2px);
        }

        /* Navigation styles */
        nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            margin-bottom: 30px;
            padding: 15px 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: underline;
        }

        footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-size: 0.9rem;
        }

        /* Confirmation Dialog Styles */
        .confirmation-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .dialog-content {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .dialog-content h3 {
            margin-bottom: 15px;
            color: #1e3a8a;
        }

        .dialog-content p {
            margin-bottom: 20px;
            color: #4a5568;
        }

        .dialog-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .dialog-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .dialog-confirm {
            background-color: #3182ce;
            color: white;
        }

        .dialog-confirm:hover {
            background-color: #2c5aa0;
        }

        .dialog-cancel {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .dialog-cancel:hover {
            background-color: #cbd5e0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .back-btn {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }

            .nav-container {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 20px;
            }

            .btn-group {
                flex-direction: column;
            }

            .quiz-meta {
                flex-direction: column;
                gap: 8px;
            }

            .correct-option::after {
                position: static;
                transform: none;
                margin-left: 10px;
            }
        }

        @media (max-width: 480px) {
            .btn {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .quiz-table th, .quiz-table td {
                padding: 8px 10px;
            }

            .correct-option::after {
                content: "✓";
                font-size: 0.9rem;
            }

            .id-cell {
                min-width: 50px;
            }
        }
    </style>
</head>
<body>
<a href="/" class="back-btn">←</a>

<div class="container">
    <div class="header">
        <h1>Quiz Admin Panel</h1>
        <p>Add new quiz questions to the database</p>
    </div>

    <div class="table-container">
        <table class="quiz-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Question</th>
                <th>Options & Answer</th>
                <th>Category & Difficulty</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${quiz}">
                <td class="id-cell" th:text="${b.id}"></td>
                <td>
                    <div class="question-title" th:text="${b.questionTitle}"></div>
                </td>
                <td>
                    <div class="options-container">
                        <div class="option" th:classappend="${b.rightAnswer == 'Option 1' ? 'correct-option' : ''}">
                            <span class="option-label">A:</span> <span th:text="${b.option1}"></span>
                        </div>
                        <div class="option" th:classappend="${b.rightAnswer == 'Option 2' ? 'correct-option' : ''}">
                            <span class="option-label">B:</span> <span th:text="${b.option2}"></span>
                        </div>
                        <div class="option" th:classappend="${b.rightAnswer == 'Option 3' ? 'correct-option' : ''}">
                            <span class="option-label">C:</span> <span th:text="${b.option3}"></span>
                        </div>
                        <div class="option" th:classappend="${b.rightAnswer == 'Option 4' ? 'correct-option' : ''}">
                            <span class="option-label">D:</span> <span th:text="${b.option4}"></span>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="quiz-meta">
                        <div class="meta-item">
                            <i class="fas fa-tag"></i>
                            <span th:text="${b.category}"></span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-chart-line"></i>
                            <span th:class="${'difficulty-' + b.difficultyLevel?.toLowerCase()}"
                                  th:text="${b.difficultyLevel}"></span>
                        </div>
                    </div>
                </td>
                <td class="action-cell">
                    <div class="btn-group">
                        <a class="btn btn-edit" th:href="@{/updateDetails/{id}(id=${b.id})}" onclick="return confirmEdit()">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <a class="btn btn-delete" th:href="@{/delete_quiz/{id}(id=${b.id})}" onclick="return confirmDelete()">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer>
        <p>Quiz Questions Management System &copy; 2025 | <b>Philasande Valentine Nkosi</b></p>
    </footer>
</div>

<script>
    // Confirmation function for delete action
    function confirmDelete() {
        return confirm('Are you sure you want to delete this quiz question?');
    }

    // Confirmation function for edit action
    function confirmEdit() {
        return confirm('Are you sure you want to edit this quiz question?');
    }
</script>
</body>
</html>
