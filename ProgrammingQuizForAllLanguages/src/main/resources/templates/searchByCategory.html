<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Questions by Category</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .search-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            color: #1e3a8a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e3a8a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
            background-color: white;
        }

        .search-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #805ad5, #6b46c1);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .search-btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .search-icon {
            font-size: 1.4rem;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 30px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .search-form {
                padding: 30px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .back-btn {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 480px) {
            .search-form {
                padding: 20px;
            }

            label {
                font-size: 1.1rem;
            }

            select, .search-btn {
                font-size: 1rem;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
<button class="back-btn" onclick="window.history.back()">←</button>

<div class="container">
    <div class="header">
        <h1>Search Questions by Category</h1>
        <p>Find quiz questions by programming language</p>
    </div>

    <!-- Search Form Section -->
    <form class="search-form" action="#" method="get">
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a programming language</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
                <option value="C++">C++</option>
                <option value="C#">C#</option>
                <option value="PHP">PHP</option>
                <option value="Swift">Swift</option>
                <option value="Go">Go</option>
            </select>
        </div>

        <button type="submit" class="search-btn">
            <span class="search-icon">🔍</span>
            <span>Search Questions</span>
        </button>
    </form>

    <div class="footer">
        <p>Select a programming language to find related quiz questions</p>
    </div>
</div>

<script>
    // Add form submission handling
    document.addEventListener('DOMContentLoaded', function() {
        const searchForm = document.querySelector('.search-form');
        const searchBtn = document.querySelector('.search-btn');

        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const category = document.getElementById('category').value;

            if (!category) {
                alert('Please select a programming language category');
                return;
            }

            // Show loading state
            const originalText = searchBtn.innerHTML;
            searchBtn.innerHTML = '<span>Searching...</span>';
            searchBtn.disabled = true;

            // Simulate API call or form submission
            setTimeout(function() {
                alert(`Searching for questions in ${category}`);

                // Reset button
                searchBtn.innerHTML = originalText;
                searchBtn.disabled = false;

                // In a real application, you would redirect or display results here
                // window.location.href = `/search-results?category=${category}`;
            }, 1000);
        });

        // Add interactive effects for the form elements
        const selectElement = document.getElementById('category');

        selectElement.addEventListener('focus', function() {
            this.style.boxShadow = '0 0 0 3px rgba(255, 255, 255, 0.5)';
        });

        selectElement.addEventListener('blur', function() {
            this.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.1)';
        });
    });
</script>
</body>
</html>
