<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Programming Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }

        .form-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* New styles for contact options */
        .contact-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
        }

        .whatsapp-btn:hover {
            background-color: #128c7e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .call-btn {
            background-color: #2575fc;
            color: white;
        }

        .call-btn:hover {
            background-color: #1c5dc1;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }

        .email-btn {
            background-color: #ea4335;
            color: white;
        }

        .email-btn:hover {
            background-color: #d23c30;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(234, 67, 53, 0.4);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .back-btn {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }

            .contact-options {
                flex-direction: column;
            }

            .contact-btn {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<!-- Back Button -->
<button class="back-btn" id="backButton" title="Go back to main page">
    <i class="fas fa-arrow-left"></i>
</button>

<!-- Header -->
<div class="header">
    <h1>Programming Quiz Platform</h1>
    <p>Sign in to access your account</p>
</div>

<!-- Login Form -->
<div class="login-container">
    <!-- Message Display -->
    <div id="message" class="message"></div>

    <form class="login-form" id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required value="Philasande@1402">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required value="Philasande@1202">
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <div class="form-footer">
            <p>If you can't login, contact admin:</p>
            <div class="contact-options">
                <a href="https://wa.me/27782913680" class="contact-btn whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp
                </a>
                <a href="tel:0782913680" class="contact-btn call-btn">
                    <i class="fas fa-phone-alt"></i>
                    Call Now
                </a>
                <a href="mailto:philasandenkosi8@gmail.com?subject=Login%20Help&body=Hello,%20I%20need%20help%20logging%20into%20the%20Programming%20Quiz%20Platform" class="contact-btn email-btn">
                    <i class="fas fa-envelope"></i>
                    Email
                </a>
            </div>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const backButton = document.getElementById('backButton');
        const messageDiv = document.getElementById('message');
        const loginForm = document.getElementById('loginForm');
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        // Show error message if present in URL
        if (error) {
            showMessage('Invalid username or password', 'error');
        }

        // Handle back button click
        backButton.addEventListener('click', function() {
            window.location.href = '/';
        });

        // Replace the form submission with AJAX
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username.trim() === '' || password.trim() === '') {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();

                if (result === 'success') {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/adminPage';
                    }, 1000);
                } else {
                    showMessage('Invalid username or password', 'error');
                }
            } catch (error) {
                showMessage('Login failed. Please try again.', 'error');
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
